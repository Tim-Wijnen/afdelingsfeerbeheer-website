<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Afdelingsfeer Balloons — font specimen</title>
    <link rel="stylesheet" href="balloon-font.css">
    <style>
      body {
        max-width: 72rem;
        margin: 0 auto;
        padding: clamp(2rem, 5vw, 5rem);
        background: #fffaf9;
        color: #6d3d08;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      h1 {
        margin: 0 0 3rem;
        font-size: clamp(3rem, 9vw, 7rem);
      }

      .specimen {
        margin: 1.5rem 0;
        overflow-wrap: anywhere;
        font-size: clamp(2rem, 5vw, 4.5rem);
      }
    </style>
  </head>
  <body>
    <h1 class="balloon-font">Afdelingsfeer!</h1>
    <p class="balloon-font specimen">ABCDEFGHIJKLMNOPQRSTUVWXYZ</p>
    <p class="balloon-font specimen">abcdefghijklmnopqrstuvwxyz</p>
    <p class="balloon-font specimen">0123456789 !?.,:; @#&amp;% €$£</p>
  </body>
</html>
